<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFF8F5" />
    <meta
      name="description"
      content="TaskPulse - a simple work assignment and query tracking system."
    />
    <title>TaskPulse</title>
    <script>
      (function () {
        try {
          document.documentElement.classList.add('no-transitions');
          if (localStorage.getItem('taskpulse-theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
